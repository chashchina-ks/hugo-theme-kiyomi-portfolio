<header class="navbar" id="navbar">
  <div class="container flex items-center justify-between" style="height: 100%;">
    <a href="{{ .Site.BaseURL }}" class="font-display font-bold text-xl text-foreground transition-colors hover:text-primary" style="letter-spacing: 0.025em;">
      {{ .Site.Params.firstName }} {{ .Site.Params.lastName }}
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex items-center gap-8" style="display: none;" id="desktop-nav">
      {{ if or (eq .RelPermalink "/") (eq .RelPermalink "/web-portfolio/") }}
        <button class="nav-link" data-scroll="about">О себе</button>
        <a href="{{ .Site.BaseURL }}portfolio/" class="nav-link">Портфолио</a>
        <button class="nav-link" data-scroll="contact">Связаться</button>
      {{ else }}
        <a href="{{ .Site.BaseURL }}portfolio/" class="nav-link">Портфолио</a>
      {{ end }}
    </nav>

    <!-- Hamburger Button -->
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false" style="display: none; padding: 0.5rem; border-radius: 0.375rem; border: none; background: none; color: hsl(var(--foreground)); cursor: pointer;">
      <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg class="icon-lg" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</header>

<!-- Mobile Backdrop -->
<div class="mobile-backdrop" id="mobile-backdrop"></div>

<!-- Mobile Menu -->
<nav class="mobile-menu" id="mobile-menu">
  {{ if or (eq .RelPermalink "/") (eq .RelPermalink "/web-portfolio/") }}
    <button class="mobile-nav-link" data-scroll="about">О себе</button>
    <a href="{{ .Site.BaseURL }}portfolio/" class="mobile-nav-link">Портфолио</a>
    <button class="mobile-nav-link" data-scroll="contact">Связаться</button>
  {{ else }}
    <a href="{{ .Site.BaseURL }}portfolio/" class="mobile-nav-link">Портфолио</a>
  {{ end }}
</nav>
